services:
  mysql:
    image: mysql:8.0
    container_name: mysql-portifolio
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: Portifolio
      MYSQL_USER: estaack
      MYSQL_PASSWORD: admin
    ports:
    - "3306:3306"
    volumes:
    - mysql-portifolio:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api-portifolio
    restart: unless-stopped
    ports:
    - "5269:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Connection: "Server=mysql;Database=Portifolio;User=estaack;Password=admin;"
      Jwt__Key: "Chave_Muito_Segura_Development_123"
    volumes:
     - aspnet-portifolio:/root/.aspnet/DataProtection-Keys
     
    depends_on:
      mysql:
        condition: service_healthy

  volumes:
    mysql-portifolio:
    aspnet-portifolio:
